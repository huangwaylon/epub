    <!-- Matches the paper background so the chrome blends in. A single meta: the script
         below sets it before first paint, and settings.svelte.ts keeps it in step with
         the resolved theme at runtime (media-query variants would fight that). -->
    <meta name="theme-color" content="#f6f3ec" />

    <!-- Apply the saved theme synchronously, before first paint, from the localStorage
         mirror of the settings (IndexedDB is the source of truth but is async). 'auto'
         (the default) follows the OS. Keep MIRROR_KEY / PAPER in sync with
         src/stores/settings.svelte.ts. -->
    <script>
      (function () {
        var paper = { light: '#f6f3ec', sepia: '#f4ecd8', dark: '#16140f' }
        var t = 'auto'
        try {
          var s = JSON.parse(localStorage.getItem('tsuzuri:settings') || 'null')
          if (s && typeof s.theme === 'string') t = s.theme
        } catch (e) {}
        if (!/^(light|sepia|dark)$/.test(t)) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', paper[t])
      })()
    </script>
