    <!-- One meta, no media variants: settings.svelte.ts updates it at runtime. -->
    <meta name="theme-color" content="#f6f3ec" />

    <!-- Theme before first paint from the settings mirror (IndexedDB is async).
         Keep the key and colours in sync with src/stores/settings.svelte.ts. -->
    <script>
      (function () {
        var paper = { light: '#f6f3ec', sepia: '#f4ecd8', dark: '#16140f' }
        var t = 'auto'
        try {
          var s = JSON.parse(localStorage.getItem('tsuzuri:settings') || 'null')
          if (s && typeof s.theme === 'string') t = s.theme
        } catch (e) {}
        if (!/^(light|sepia|dark)$/.test(t)) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', paper[t])
      })()
    </script>
