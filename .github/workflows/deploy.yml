name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `sharp` (local-only script dep) crashes npm in CI ("Exit handler never called!"),
      # so drop it and resolve fresh without the lockfile.
      - name: Install dependencies (excluding local-only sharp)
        run: |
          npm pkg delete devDependencies.sharp
          rm -f package-lock.json
          npm install --include=dev --no-audit --no-fund
        env:
          NODE_ENV: development
      - name: Verify vite is installed
        run: |
          if [ -x node_modules/.bin/vite ]; then
            echo "vite $(node_modules/.bin/vite --version) installed"
          else
            echo "::error::vite is not in node_modules/.bin after install"
            ls node_modules/.bin | head -50
            exit 1
          fi
      - run: npm run build
      # Sets the repo's Pages source to "GitHub Actions" if needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
